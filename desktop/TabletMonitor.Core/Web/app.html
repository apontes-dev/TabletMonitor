<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TabletMonitor">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>TabletMonitor</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #v { position: absolute; left: 0; top: 0; touch-action: none; image-rendering: auto; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #101418; color: #e8eef2; text-align: center; padding: 24px;
    font: 16px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif;
  }
  #overlay.hidden { display: none; }
  h1 { font-weight: 300; font-size: 34px; margin: 0; letter-spacing: .2px; }
  #status { color: #3ddc97; font-size: 20px; margin: 14px 0 22px; }
  #info { color: #96a0aa; font-size: 15px; max-width: 560px; }
  #info b { color: #c8d0d8; font-weight: 600; }
  #hint { color: #6a747e; font-size: 13px; margin-top: 28px; max-width: 520px; }
  a { color: #3ddc97; }
</style>
</head>
<body>
<canvas id="v" width="2" height="2"></canvas>
<div id="overlay">
  <h1>TabletMonitor</h1>
  <div id="status">Conectando…</div>
  <div id="info"></div>
  <div id="hint"></div>
</div>
<script>
'use strict';
// Protocolo TMON v3 (mesmo do app Android) dentro de um WebSocket: cada mensagem binária é um pacote
// [tipo u8][tamanho u32][payload]. O PC escolhe H.264 (WebCodecs) ou JPEG conforme o que este navegador decodifica.
const T = { HELLO: 0x00, CONFIG: 0x01, CSD: 0x02, FRAME: 0x03, TOUCH: 0x10, PING: 0x20, PONG: 0x21 };
const CODEC_H264 = 0, CODEC_JPEG = 1;

const params = new URLSearchParams(location.search);
const forceJpeg = params.get('modo') === 'jpeg' || params.get('mode') === 'jpeg';
const hasWebCodecs = typeof VideoDecoder !== 'undefined' && typeof EncodedVideoChunk !== 'undefined' && !forceJpeg;
const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;

const canvas = document.getElementById('v');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
const overlay = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const infoEl = document.getElementById('info');
const hintEl = document.getElementById('hint');

let ws = null, connected = false;
let codec = CODEC_H264, vw = 0, vh = 0;
let decoder = null, csd = null, needKey = true, configuredCodec = '';
let jpegBusy = false, jpegPending = null;
let helloSize = null, retryTimer = null, wakeLock = null;
let frames = 0, lastFpsAt = performance.now(), fps = 0;

// ------------------------------------------------------------------ UI
function show(text) {
  statusEl.textContent = text;
  overlay.classList.remove('hidden');
}
function renderInfo() {
  const mode = hasWebCodecs ? '<b>H.264</b> (decodificação por hardware)' : '<b>JPEG</b> (modo compatível)';
  let html = `PC: <b>${location.hostname}</b><br>Vídeo: ${mode}`;
  if (!hasWebCodecs && !forceJpeg) {
    html += location.protocol === 'https:'
      ? '<br>Este navegador não tem WebCodecs (precisa iOS/iPadOS 16.4 ou mais novo).'
      : `<br>Para H.264, instale o certificado: <a href="/">instruções</a>.`;
  }
  infoEl.innerHTML = html;
  hintEl.innerHTML = standalone
    ? 'Para travar o aparelho neste app: Ajustes &gt; Acessibilidade &gt; Acesso Guiado.'
    : 'Dica: Compartilhar &gt; <b>Adicionar à Tela de Início</b> para abrir em tela cheia, como app.';
}

function layout() {
  if (!vw || !vh) return;
  const W = window.innerWidth, H = window.innerHeight;
  const s = Math.min(W / vw, H / vh);
  const cw = Math.round(vw * s), ch = Math.round(vh * s);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.style.left = Math.round((W - cw) / 2) + 'px';
  canvas.style.top = Math.round((H - ch) / 2) + 'px';
}

function screenInfo() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.round(window.innerWidth * dpr) & ~1;
  const h = Math.round(window.innerHeight * dpr) & ~1;
  return { w, h, dpi: Math.round(160 * dpr) };
}

function deviceName() {
  const ua = navigator.userAgent;
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'iPad (navegador)';
  if (/iPhone/.test(ua)) return 'iPhone (navegador)';
  if (/Android/.test(ua)) return 'Android (navegador)';
  return 'Navegador';
}

// ------------------------------------------------------------------ conexão
function connect() {
  clearTimeout(retryTimer);
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  try {
    ws = new WebSocket(`${proto}//${location.host}/ws`);
  } catch (e) {
    show('Não foi possível conectar');
    retryTimer = setTimeout(connect, 2000);
    return;
  }
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { connected = true; show('Conectado — aguardando vídeo…'); sendHello(); requestWakeLock(); };
  ws.onmessage = (e) => onMessage(e.data);
  ws.onclose = () => {
    connected = false;
    teardown();
    show('PC desconectado — tentando de novo…');
    retryTimer = setTimeout(connect, 1500);
  };
  ws.onerror = () => {};
}

function send(type, payload) {
  if (!ws || ws.readyState !== 1) return;
  const buf = new Uint8Array(5 + payload.length);
  const dv = new DataView(buf.buffer);
  buf[0] = type;
  dv.setUint32(1, payload.length);
  buf.set(payload, 5);
  ws.send(buf);
}

function sendHello() {
  const s = screenInfo();
  helloSize = s;
  // H.264 até 1920 de largura; JPEG até 1280 (banda).
  const cap = hasWebCodecs ? 1920 : 1280;
  const maxW = Math.min(s.w, cap) & ~1;
  const maxH = Math.round(maxW * s.h / s.w) & ~1;
  const name = new TextEncoder().encode(deviceName());
  const p = new Uint8Array(12 + name.length);
  const dv = new DataView(p.buffer);
  p[0] = 3;                         // versão
  dv.setUint16(1, s.w); dv.setUint16(3, s.h); dv.setUint16(5, s.dpi);
  dv.setUint16(7, maxW); dv.setUint16(9, maxH);
  p[11] = (hasWebCodecs ? 1 : 0) | 2; // bit0 H.264, bit1 JPEG
  p.set(name, 12);
  ws.send(new TextEncoder().encode('TMON'));
  send(T.HELLO, p);
}

function teardown() {
  if (decoder) { try { decoder.close(); } catch (_) {} }
  decoder = null; csd = null; needKey = true; configuredCodec = '';
  jpegPending = null;
  vw = vh = 0;
}

// ------------------------------------------------------------------ pacotes
function onMessage(buf) {
  const all = new Uint8Array(buf);
  let off = 0;
  while (off + 5 <= all.length) {
    const type = all[off];
    const len = new DataView(buf, off + 1, 4).getUint32(0);
    const p = all.subarray(off + 5, off + 5 + len);
    off += 5 + len;
    onPacket(type, p);
  }
}

function onPacket(type, p) {
  const dv = new DataView(p.buffer, p.byteOffset, p.byteLength);
  switch (type) {
    case T.CONFIG: {
      vw = dv.getUint16(0); vh = dv.getUint16(2);
      codec = p.length >= 7 ? p[6] : CODEC_H264;
      canvas.width = vw; canvas.height = vh;
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, vw, vh);
      if (decoder) { try { decoder.close(); } catch (_) {} decoder = null; }
      needKey = true; configuredCodec = '';
      layout();
      overlay.classList.add('hidden');
      break;
    }
    case T.CSD:
      csd = p.slice();
      break;
    case T.FRAME: {
      if (p.length <= 9) return;
      const key = (p[0] & 1) === 1;
      const pts = Number(dv.getBigUint64(1));
      const data = p.subarray(9);
      if (codec === CODEC_JPEG) onJpeg(data);
      else onH264(key, pts, data);
      countFrame();
      break;
    }
    case T.PONG:
      break;
  }
}

function countFrame() {
  frames++;
  const now = performance.now();
  if (now - lastFpsAt > 1000) { fps = frames; frames = 0; lastFpsAt = now; }
}

// ------------------------------------------------------------------ H.264 (WebCodecs)
function nalType(b, i) { return b[i] & 0x1f; }

/** Acha o SPS (tipo 7) em Annex-B e monta "avc1.PPCCLL". */
function avcCodecString(b) {
  for (let i = 0; i + 4 < b.length; i++) {
    if (b[i] === 0 && b[i + 1] === 0 && (b[i + 2] === 1 || (b[i + 2] === 0 && b[i + 3] === 1))) {
      const s = b[i + 2] === 1 ? i + 3 : i + 4;
      if (nalType(b, s) === 7 && s + 3 < b.length) {
        const h = (x) => x.toString(16).padStart(2, '0');
        return 'avc1.' + h(b[s + 1]) + h(b[s + 2]) + h(b[s + 3]);
      }
    }
  }
  return '';
}

function hasSps(b) { return avcCodecString(b.subarray(0, Math.min(b.length, 64))) !== ''; }

function ensureDecoder(keyData) {
  const codecStr = avcCodecString(csd || keyData) || 'avc1.42E01F';
  if (decoder && configuredCodec === codecStr) return true;
  if (decoder) { try { decoder.close(); } catch (_) {} }
  decoder = new VideoDecoder({
    output: (frame) => {
      ctx.drawImage(frame, 0, 0, vw, vh);
      frame.close();
    },
    error: (e) => {
      console.error('decoder', e);
      needKey = true; configuredCodec = '';
      try { decoder.close(); } catch (_) {}
      decoder = null;
      // Sem como pedir keyframe ao PC: reconecta para recomeçar a sequência.
      if (ws) ws.close();
    },
  });
  decoder.configure({ codec: codecStr, optimizeForLatency: true });
  configuredCodec = codecStr;
  return true;
}

function onH264(key, pts, data) {
  if (needKey && !key) return;
  if (key) {
    // Sem "description" o WebCodecs espera Annex-B com SPS/PPS no keyframe.
    if (csd && !hasSps(data)) {
      const merged = new Uint8Array(csd.length + data.length);
      merged.set(csd, 0); merged.set(data, csd.length);
      data = merged;
    }
    if (!ensureDecoder(data)) return;
  }
  if (!decoder) return;
  // Fila do decodificador grande demais = atraso: espera o próximo keyframe.
  if (!key && decoder.decodeQueueSize > 6) { needKey = true; return; }
  decoder.decode(new EncodedVideoChunk({ type: key ? 'key' : 'delta', timestamp: pts, data }));
  needKey = false;
}

// ------------------------------------------------------------------ JPEG
function onJpeg(data) {
  // Só o quadro mais novo importa: se ainda está desenhando o anterior, guarda este e descarta o que estava esperando.
  jpegPending = data.slice();
  if (!jpegBusy) drawNextJpeg();
}

function drawNextJpeg() {
  const data = jpegPending;
  jpegPending = null;
  if (!data) { jpegBusy = false; return; }
  jpegBusy = true;
  createImageBitmap(new Blob([data], { type: 'image/jpeg' }))
    .then((bmp) => { ctx.drawImage(bmp, 0, 0, vw, vh); if (bmp.close) bmp.close(); })
    .catch(() => {})
    .finally(drawNextJpeg);
}

// ------------------------------------------------------------------ toque
const pointerIds = new Map();
function slotFor(pointerId) {
  if (pointerIds.has(pointerId)) return pointerIds.get(pointerId);
  const used = new Set(pointerIds.values());
  for (let i = 0; i < 10; i++) if (!used.has(i)) { pointerIds.set(pointerId, i); return i; }
  return -1;
}

function sendTouch(action, slot, e) {
  if (slot < 0) return;
  const r = canvas.getBoundingClientRect();
  const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
  const p = new Uint8Array(6);
  const dv = new DataView(p.buffer);
  p[0] = action; p[1] = slot;
  dv.setUint16(2, Math.round(x * 65535)); dv.setUint16(4, Math.round(y * 65535));
  send(T.TOUCH, p);
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  sendTouch(0, slotFor(e.pointerId), e);
});
canvas.addEventListener('pointermove', (e) => {
  if (!pointerIds.has(e.pointerId)) return;
  e.preventDefault();
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  sendTouch(1, pointerIds.get(e.pointerId), events.length ? events[events.length - 1] : e);
});
function endPointer(action) {
  return (e) => {
    if (!pointerIds.has(e.pointerId)) return;
    e.preventDefault();
    sendTouch(action, pointerIds.get(e.pointerId), e);
    pointerIds.delete(e.pointerId);
  };
}
canvas.addEventListener('pointerup', endPointer(2));
canvas.addEventListener('pointercancel', endPointer(3));
// Impede rolagem/zoom/menu do Safari sobre a imagem
for (const ev of ['touchstart', 'touchmove', 'gesturestart', 'gesturechange', 'contextmenu'])
  document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });

// ------------------------------------------------------------------ tela, orientação, energia
let resizeTimer = null;
window.addEventListener('resize', () => {
  layout();
  clearTimeout(resizeTimer);
  // Girou o aparelho: renegocia o tamanho do vídeo com o PC.
  resizeTimer = setTimeout(() => {
    const s = screenInfo();
    if (connected && helloSize && (Math.abs(s.w - helloSize.w) > 8 || Math.abs(s.h - helloSize.h) > 8)) ws.close();
  }, 700);
});

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (_) { /* sem suporte: ajuste Ajustes > Tela e Brilho > Bloqueio Automático > Nunca */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    requestWakeLock();
    if (!ws || ws.readyState > 1) connect();
  }
});

// Ping a cada 2 s mantém a conexão viva em redes que derrubam conexões ociosas.
setInterval(() => {
  if (!connected) return;
  const p = new Uint8Array(8);
  new DataView(p.buffer).setBigUint64(0, BigInt(Date.now()));
  send(T.PING, p);
}, 2000);

window.TabletMonitor = { get fps() { return fps; }, get codec() { return codec; }, get size() { return [vw, vh]; } };
renderInfo();
connect();
</script>
</body>
</html>
